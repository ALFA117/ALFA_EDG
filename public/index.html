        <h1 style="font-family:monospace">ALFA-EDG — Builder Web3 + IA</h1>
        <p>Desarrollador full-stack en México. 38 proyectos que puedes abrir y probar: Web3, agentes de IA, seguridad on-chain y sitios para negocios. Esta es la versión sin JavaScript; actívalo para ver el sitio completo.</p>
        <p>Contacto: <a href="https://github.com/ALFA117">GitHub</a> · <a href="https://www.linkedin.com/in/edgar-lopez-baeza-6b5a22353">LinkedIn</a> · <a href="https://wa.me/525655102956?text=Hola%20Edgar%2C%20vi%20tu%20portafolio%20y%20quiero%20platicar%20de%20un%20proyecto">WhatsApp</a> · <a href="mailto:edgarlopezbaeza.ing@gmail.com">Email</a> · <a href="https://x.com/ALFA_EDG">X</a> · <a href="https://t.me/ALFA_EDG">Telegram</a> · <a href="https://www.instagram.com/alfa_edg.mou/">Instagram</a> · <a href="https://www.facebook.com/edgar.lopez.58747?locale=es_LA">Facebook</a></p>
        <h2 style="font-family:monospace">Proyectos (38)</h2>
        <ul>
          <li><a href="https://kipu-anon.vercel.app/">kipu-anon</a> — Privacidad de datos · API. Servicio que seudonimiza las conversaciones de soporte de una fintech ficticia (Kipu Pay). Cada cliente recibe un disfraz estable, con otro nombre, otra cédula y otro correo, que se mantiene en chats, documentos y tablas, para que los datos sirvan para entrenar modelos sin exponer a nadie. Funciona con reglas, sin IA generativa. Hecho con Elizabeth Cruz en el hackathon Frontier CDMX/26 (lab10.ai); en la página puedes probarlo con un mensaje.</li>
          <li><a href="https://fyv-box.vercel.app/">FYV Box</a> — Web3 · Educación en Seguridad · Stellar testnet. Simulador gratuito de estafas crypto en español: 22 simulacros (phishing, airdrops falsos, ingeniería social, firmas peligrosas, preventas falsas, manejo de llaves) en 6 módulos. Al completar un módulo recibes una credencial en Stellar testnet (transacción + contrato Soroban) que cualquier wallet o dApp puede verificar.</li>
          <li><a href="https://sepuente.vercel.app/">SEPuente</a> — Web3 · Stellar · SPEI · Stellar testnet · SPEI simulado. Gateway open source y no custodial que presenta las rampas de pesos mexicanos como un anchor estándar de Stellar (SEP-1, 10, 24 y 38): mandas pesos por SPEI (simulado en la demo) y los recibes en cualquier wallet SEP-24, y de regreso. Pasó 75 de 76 pruebas oficiales de anchor de SDF. Hoy los depósitos y retiros de la demo están en pausa mientras vuelve su base de datos. Construido para GOYA HACK · CriptoUNAM 2026.</li>
          <li><a href="https://el-velador-bot.vercel.app/">El Velador</a> — Web3 · Bot de Seguridad · Solana mainnet · solo lectura. Bot de Telegram que revisa tokens de pump.fun (quién los lanzó, qué tan concentrada está la oferta y si el creador ya vendió) y responde con un semáforo de riesgo y su razón. En pausa: pump.fun bloquea las consultas automáticas a su API y su base de datos está caída, así que hoy no genera reportes nuevos.</li>
          <li><a href="https://squash-pay.vercel.app/">Squash</a> — Web3 · Hedera · x402 · Hedera testnet. Divide la cuenta en la mesa con un QR: cada quien confirma su parte y una sola transacción programada en Hedera testnet liquida todo con el último «sí». Su motor de compensación calcula el mínimo exacto de transferencias (15 deudas cruzadas → 3 pagos) y cobra cada cálculo vía x402. Hoy funciona el viaje de ejemplo; dividir una cuenta nueva está fuera de línea mientras vuelve su base de datos.</li>
          <li><a href="https://ronda-ciega.vercel.app/">Ronda Ciega</a> — Web3 · Solana · Privacidad · Solana devnet · MagicBlock Private ER. Matching estable a ciegas en Solana: founders y builders se rankean entre sí, el algoritmo Gale–Shapley corre dentro de un Private Ephemeral Rollup de MagicBlock con aleatoriedad VRF y solo salen las parejas; las listas de preferencias nunca se publican. Puedes correr el algoritmo en el navegador sin wallet. Construido para MagicBlock Solana Blitz v8.</li>
          <li><a href="https://palpito-somnia.vercel.app/">Palpito</a> — Web3 · Somnia · Social · Somnia testnet. Muro social de predicciones sobre BTC y ETH: cada palpito es una posición real en los event contracts de DreamDEX que un oráculo liquida al cerrar la ventana, con un ranking calculado desde la cadena. Para hacer uno necesitas una wallet con tokens de testnet. Construido para el Somnia × DreamDEX Hackathon.</li>
          <li><a href="https://mad-mongli-agent.vercel.app/">MAD</a> — IA · Agente de Trading · Gensyn testnet · competencia terminada. Agente de trading autónomo que solo apostaba en un mercado de predicción cuando un dato público con nombre respaldaba el número, y se abstenía si no. Compitió en el Delphi Agent Arena de Gensyn (14–24 ago 2026) y cerró en 1,766.37 TST, puesto 18 de 164; la página muestra ese registro final.</li>
          <li><a href="https://avs-mou.vercel.app/">AVS</a> — Web3 · Solana · Solana devnet. Sindicatos de inversión con pujas selladas en Solana: los inversores pujan y votan los hitos de una startup, y los montos se revelan a la vez. La privacidad se apoya en cuentas con permiso de MagicBlock Ephemeral Rollups; el sitio publicado es una demo en devnet y hoy no tiene rondas abiertas para pujar. Construido para el Solana Blitz V7 Hackathon.</li>
          <li><a href="https://mou-casper.vercel.app/">AVAL</a> — DeFi · Agentes IA · Casper testnet. Mesa de suscripción de riesgo autónoma en Casper: dos agentes de IA cotizan un lote de facturas de demostración y respaldan su cotización con CSPR propio; si se equivocan, pierden stake y reputación on-chain. El sitio muestra en solo lectura el stake real en la cadena y el historial de corridas de julio. Casper Agentic Buildathon 2026.</li>
          <li><a href="https://moufut.vercel.app/">Mou Fut</a> — P2P · IA on-device · Sepolia testnet · modo demo. Fútbol P2P sin servidor: chat en malla, comentarista con IA on-device y quiniela en USDt con apuestas firmadas entre pares, con la cartera en modo demo sobre Sepolia. Es una app de escritorio hecha en Pear; la página es su landing con una demo animada. Tether Developers Cup 2026.</li>
          <li><a href="https://nexus-latam-kappa.vercel.app/">Nexus LATAM</a> — B2B · Arbitrum · Arbitrum Sepolia · demo simulada. Concepto de liquidación y financiamiento de comercio B2B en LATAM con agentes de IA, contratos en Arbitrum Stylus y rieles de pago de Bitso. El sitio es una demo simulada: los contratos y la API no están desplegados, así que operaciones, cifras y actividad de agentes son datos de ejemplo. ETH México 2026.</li>
          <li><a href="https://monkeyclone.vercel.app/">MonkeyClone</a> — Web3 · Solana · Solana devnet · modo demo. Copy-trading en Solana con mecánica de fantasy draft: eliges tres traders, depositas una vez y el protocolo copia sus operaciones de forma proporcional. La web es una demo con traders de ejemplo y un vault simulado en tu navegador, sin wallet ni dinero real; el programa Anchor ya está en devnet.</li>
          <li><a href="https://chainguard-pi.vercel.app/">ChainGuard</a> — Web3 · Seguridad · Análisis estático · sin wallet. Escáner de contratos Solidity: pegas el código y en menos de un segundo marca 6 tipos de vulnerabilidad del registro SWC (reentrancy, tx.origin, overflow, llamadas sin verificar, selfdestruct sin protección y visibilidad faltante), con reporte en PDF. Es una revisión automática por patrones, no sustituye una auditoría. Hecho para HackOWASP 8.0.</li>
          <li><a href="https://mongli-agent-ia.vercel.app/">Mou IA</a> — IA · Mantle · On-chain · Mantle · modo demo. Dashboard de inteligencia on-chain para seguir «smart money» en Mantle: feed de señales, explorador de wallets y analítica de ballenas y anomalías. Hoy corre en modo demo con señales de ejemplo; el contrato y el agente que las escriben on-chain aún no están desplegados.</li>
          <li><a href="https://mongli-pool.vercel.app/">Mongli Pool</a> — Web3 · Pool · Stellar testnet. Pool de privacidad en Stellar con cumplimiento integrado: depositas y retiras a otra dirección sin que nadie pueda vincular ambas operaciones. La prueba ZK (Groth16) se genera en tu navegador y la verifica un contrato Soroban. Se puede probar sin wallet con una cuenta temporal de testnet. Construido para Stellar Hacks: ZK 2025.</li>
          <li><a href="https://presentacionde-monglipool.vercel.app/">Mongli Pool</a> — Diseño Web · Presentación. Un framework de presentación hecho desde cero en HTML/CSS/JS puro, sin build: navegación con teclado y swipe, transiciones animadas, EN/ES, tema claro/oscuro y un fondo 3D hecho solo con CSS. Aquí lleva el pitch de MongliPool como contenido, pero lo que se entrega es el framework.</li>
          <li><a href="https://mongli-game.vercel.app/">Mongli Game</a> — Gaming · 0G Galileo testnet. Thriller noir de amnesia: un narrador con IA escribe fragmentos de memoria según tus decisiones a lo largo de 5 actos. Con wallet, cada acto terminado y cada récord de speedrun queda registrado con una transacción real en 0G Galileo testnet; el guardado del texto en 0G Storage aún es simulado. Zero Cup 2026.</li>
          <li><a href="https://kivo-app-five.vercel.app/">Kivo App</a> — Web3 · Stellar · Stellar testnet · vista demo. Custodia programática (escrow) sobre Stellar para el comercio mexicano: el dinero queda retenido en un contrato y solo se libera cuando ambas partes confirman la entrega (con Trustless Work). El sitio publicado es una vista demo: crear y financiar custodias requiere llaves que este despliegue no tiene. Construido para el Stellar Hackathon 2026.</li>
          <li><a href="https://crystal-vanilla.vercel.app/">Crystal Vanilla</a> — Web App. Calculadora de producción para un negocio de extracto de vainilla: convierte los litros disponibles en tiendas, cajas, botellas y rollos de etiquetas (o al revés, de tiendas a litros) y exporta el resultado a PDF. Hecha para un cliente freelance.</li>
          <li><a href="https://wall-of-guardians.vercel.app/">Refugio</a> — Decentraland · Social · Decentraland SDK7 · demo web. Una fogata multijugador para Decentraland (SDK7) que solo arde cuando llega gente, sin anfitrión ni evento programado, con un minijuego cooperativo para mantenerla viva. Aquí se ve el sitio companion: un leaderboard con datos de muestra (la escena aún no está publicada) y una demo jugable de la mecánica en el navegador. Hecho para el Friendzone Hackathon.</li>
          <li><a href="https://flor-de-sil.vercel.app/">Flor de Sil</a> — Freelance / Cliente. Catálogo en línea de arreglos florales con panel de administración para manejar el inventario y las fotos; los pedidos llegan por WhatsApp. Hecho para un cliente freelance. Hoy el catálogo está fuera de línea mientras vuelve su base de datos.</li>
          <li><a href="https://mercadito-mex.vercel.app/">MercaditoMex</a> — IA · Marketplace. Marketplace mexicano por voz: el vendedor sube fotos y dice el precio, y la IA redacta la ficha para que él la revise y publique; el comprador también busca hablando o escribiendo, y la IA convierte la frase en filtros. En beta cerrada, con catálogo real.</li>
          <li><a href="https://wip-piggy.vercel.app/">WIP</a> — Agente IA · WDK · Wallet · Sepolia testnet. Alcancía compartida con un agente que tiene billetera propia: pides un pago escribiendo y un reglamento determinista (topes, lista blanca, presupuesto mensual, aprobaciones) decide si se envía USD₮ de prueba en Sepolia o te dice qué regla rompiste. Cada pago y cada rechazo queda registrado. Hoy el panel está fuera de línea mientras vuelve su base de datos. Construido para el Aleph Hackathon, WDK Track.</li>
          <li><a href="https://monglizone.vercel.app/">MongliZone</a> — IA · Mind de Contenido · IA · acceso con clave. Director de contenido con IA: le das una idea por texto o nota de voz (web o Telegram), decide el formato (carrusel de varias fotos, video de 1–3 min o caption), lo genera, lo manda a revisión y solo publica si lo apruebas. Construido como Mind sobre Minds by Animoca Brands; la web es de uso interno y pide clave de acceso.</li>
          <li><a href="https://mou-x402.vercel.app/">Moux402</a> — Infra · x402 · Base Sepolia · Solana devnet · Stellar testnet. Pon cualquier API detrás de un cobro por llamada con el protocolo x402 en un solo comando (npx x402ify): el comprador, humano o agente de IA, paga desde su wallet y el pago llega directo a la wallet del vendedor, sin custodia ni registro. Demo en testnets.</li>
          <li><a href="https://showcase-edg.vercel.app/barberias/barberia-urbana">Barbería Urbana</a> — Web2 · Barbería · Demo · negocio ficticio. Landing editorial de barbería con reserva guiada (servicio → barbero → horario) que deja listo el mensaje de WhatsApp, precios estilo ticket y botón directo a WhatsApp. Negocio ficticio: la agenda es simulada. Una de 12 demos comerciales para vender sitios web a negocios locales.</li>
          <li><a href="https://showcase-edg.vercel.app/barberias/barberia-premium">Barbería Premium</a> — Web2 · Barbería · Demo · negocio ficticio. Sitio de barbería editorial y pausado, con mucho espacio en blanco y un único modal de reserva (servicio, barbero y horario) que termina en WhatsApp. Agenda simulada.</li>
          <li><a href="https://showcase-edg.vercel.app/barberias/barberia-moderna">Barbería Moderna</a> — Web2 · Barbería · Demo · negocio ficticio. Demo de barbería con estética Gen Z: nav en píldora, servicios en stories horizontales estilo Instagram y reserva en 4 pasos con puntos de progreso animados.</li>
          <li><a href="https://showcase-edg.vercel.app/autos/agencia-seminuevos">Auto Confianza CDMX</a> — Web2 · Agencia de Autos · Demo · negocio ficticio. Demo de agencia de seminuevos: inventario con búsqueda, filtros (carrocería y precio) y orden, comparador de 2 autos y simulador de mensualidad en la ficha de cada vehículo (cálculo estimado).</li>
          <li><a href="https://showcase-edg.vercel.app/autos/autos-premium">Aurea Motors</a> — Web2 · Agencia de Autos · Demo · marca ficticia. Microsite cinematográfico de un solo auto de una marca de lujo ficticia: el configurador de color cambia la foto al momento y las cifras clave cuentan hasta su valor al aparecer.</li>
          <li><a href="https://showcase-edg.vercel.app/autos/autos-camionetas">Terreno Norte 4x4</a> — Web2 · Agencia de Autos · Demo · negocio ficticio. Demo de agencia de pickups y SUVs: inventario filtrable por terreno, tabla comparativa pickup vs SUV y barras animadas de carga y remolque en cada ficha.</li>
          <li><a href="https://showcase-edg.vercel.app/belleza/tienda-productos">Casa Aroma</a> — Web2 · E-commerce Belleza · Demo · negocio ficticio. E-commerce de belleza completo en modo demo: catálogo con búsqueda, categorías y orden, carrito lateral y checkout simulado de 3 pasos (no cobra ni envía nada).</li>
          <li><a href="https://showcase-edg.vercel.app/belleza/boutique-cosmeticos">Maison Ámbar</a> — Web2 · E-commerce Belleza · Demo · marca ficticia. Sitio editorial de cosmética de lujo: colección que se recorre arrastrando, título que aparece letra por letra y nav que se oculta al bajar y vuelve al subir.</li>
          <li><a href="https://showcase-edg.vercel.app/belleza/cabello-skincare">Raíz &amp; Piel</a> — Web2 · E-commerce Belleza · Demo · marca ficticia. Demo de cabello y skincare construida alrededor de un quiz de 3 preguntas que recomienda productos del catálogo de la tienda ficticia.</li>
          <li><a href="https://showcase-edg.vercel.app/dentistas/consultorio-familiar">Consultorio Dental Familiar</a> — Web2 · Clínica Dental · Demo · negocio ficticio. Demo de consultorio dental familiar: servicios en tarjetas con ícono, agenda de citas simulada (fecha, hora y datos de contacto) y preguntas frecuentes en acordeón.</li>
          <li><a href="https://showcase-edg.vercel.app/dentistas/clinica-premium">Clínica Dental Premium</a> — Web2 · Clínica Dental · Demo · negocio ficticio. Microsite de clínica dental premium: especialistas, tratamientos en pestañas con precio «desde $X», timeline de la experiencia del paciente y formulario de valoración simulado.</li>
          <li><a href="https://showcase-edg.vercel.app/dentistas/clinica-estetica">Clínica de Estética Dental</a> — Web2 · Clínica Dental · Demo · negocio ficticio. Demo de estética dental construida alrededor de un comparador antes/después que se arrastra con mouse o con el dedo y también se maneja con teclado.</li>
